[package]
name = "cipherlayer-simulation"
description = "Provider-neutral transaction simulation with an Anvil local-node implementation. Evidence, never a guarantee."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cipherlayer-types = { workspace = true }
