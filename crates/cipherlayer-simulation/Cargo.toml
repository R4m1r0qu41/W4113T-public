cipherlayer-evm = { workspace = true }
alloy = { workspace = true, features = ["std", "providers", "provider-http", "reqwest-rustls-tls", "rpc-types", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
tokio = { version = "1", features = ["time"] }
