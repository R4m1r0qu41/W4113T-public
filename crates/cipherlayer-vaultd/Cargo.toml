[package]
name = "cipherlayer-vaultd"
description = "Vault daemon (ADR-004 W2): the Vault as a separate OS process behind a narrow, schema-validated Unix-socket IPC. Minimal codebase by design; test keys only (ADR-005)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Enables only explicit in-process setup used by real-socket security tests.
# Production/default builds expose no API that can install an approved
# Solana ceremony without the trusted phase-1 prompt.
test-seams = []

[dependencies]
cipherlayer-vault = { workspace = true }
cipherlayer-policy = { workspace = true }
# ADR-021: cluster-id constants (single source), hex for the message wire,
# key-buffer wipe, phase-2 nonce.
cipherlayer-chain = { workspace = true }
alloy = { workspace = true }
zeroize = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
cipherlayer-types = { workspace = true }
tempfile = "3"
