name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, offline of any push — catches toolchain/dependency drift and
    # anything the family review loop's Tier-0 checks would flag even when
    # nobody has committed (family guide §7).
    - cron: '17 4 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: make ci (fmt · clippy · unit · docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # docs-check compares the matrix header date with git history
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: make ci
        run: make ci

  integration:
    name: integration + security-regression (Anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
      - name: Anvil up
        run: make anvil-up
      - name: Integration suite
        run: make test-integration
      - name: Anvil down
        if: always()
        run: make anvil-down

  # Supply-chain gates (W1-remainder). Both need network (advisory-DB fetch,
  # crates.io installs) so they run as their own jobs, never folded into the
  # offline `make ci` gate above.
  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: make audit
        run: make audit

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: make sbom
        run: make sbom
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/sbom/
